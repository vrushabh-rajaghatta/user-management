# The developer environment: the base stack, plus the browser path and hot
# reload.
#
#   ./up.sh     brings this up; it is the entry point, and passing this file is
#               an implementation detail of it.
#
# An EXPLICIT overlay rather than compose.override.yaml, deliberately. An
# override file is merged automatically, which would quietly change what plain
# `docker compose up` means. The base compose.yaml keeps its production-shaped
# meaning — database, schema and API — and this file is what adds bind mounts,
# development images and the web client.
#
# Nothing here is production-shaped. The development images run as root, carry
# the SDK, and mount the working tree. The production stages in
# docker/Dockerfile are untouched by any of it.

name: ligature

services:

  # ---------------------------------------------------------------- API

  # The same service, built from the SDK target and watching the source tree
  # instead of running a published artefact.
  host:
    build:
      target: host-dev
    volumes:
      # The working tree, so a saved .cs file is seen by dotnet watch.
      - ./:/source

      # obj/ and bin/ are NOT shared with the developer's machine. MSBuild
      # records absolute paths and a runtime identifier in project.assets.json,
      # so a Linux container and a macOS host writing the same directories
      # would each invalidate the other's build on every switch. One volume per
      # project, named individually: a future project gets no volume by
      # accident, and tooling/docker.test.ts fails until one is added.
      - nuget:/root/.nuget/packages
      - host-obj:/source/src/Host/Ligature.Host/obj
      - host-bin:/source/src/Host/Ligature.Host/bin
      - application-obj:/source/src/Platform/Ligature.Platform.Application/obj
      - application-bin:/source/src/Platform/Ligature.Platform.Application/bin
      - domain-obj:/source/src/Platform/Ligature.Platform.Domain/obj
      - domain-bin:/source/src/Platform/Ligature.Platform.Domain/bin
      - persistence-obj:/source/src/Platform/Ligature.Platform.Persistence/obj
      - persistence-bin:/source/src/Platform/Ligature.Platform.Persistence/bin
      - sharedkernel-obj:/source/src/Shared/Ligature.SharedKernel/obj
      - sharedkernel-bin:/source/src/Shared/Ligature.SharedKernel/bin

    environment:
      # The DEVELOPMENT MAIL SINK (docs/architecture.md §8). Activation and
      # reset messages are written to .secrets/mail in the working tree —
      # visible here through the /source mount, git-ignored with the rest of
      # .secrets/ — instead of being sent. up.sh creates the directory; the sink
      # never does. Only this overlay sets it: compose.yaml keeps its production
      # shape, and a Release build refuses the setting outright.
      LIGATURE_MAIL_DEV_SINK_DIRECTORY: /source/.secrets/mail

      # The origin the links are built from: the web client, where /activate
      # and /reset-password are served.
      LIGATURE_PUBLIC_BASE_URL: https://localhost:5173

      # Behaviour 11 (B8, B9). The host believes X-Forwarded-For from exactly
      # one peer: the web container's Vite proxy, pinned below. Not the whole
      # network, so nothing else on it can claim an address. Without this,
      # every browser would reach the rate limit as the web container.
      LIGATURE_TRUSTED_PROXIES: 172.31.211.200

    healthcheck:
      # LIVENESS, not readiness. It proves Kestrel is listening and the request
      # pipeline runs. It says nothing about the database, and it deliberately
      # asserts no particular status: an unauthenticated /api/me answers 401,
      # and a probe that pinned that would start failing the day the endpoint's
      # contract changed, for no gain.
      #
      # Only the development image. The production `host` target is built from
      # the aspnet runtime image, which has no curl, so the base compose.yaml
      # keeps its production shape and adds nothing.
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8080/api/me"]
      interval: 10s
      timeout: 5s
      retries: 3

      # Generous: `dotnet watch` builds the solution before it serves anything,
      # and a cold container with an empty obj/ volume takes minutes. A failure
      # inside the grace period does not count against retries.
      start_period: 180s

  # ------------------------------------------------------------ web client

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web-dev
    ports:
      # The origin the browser, the carrier cookie and the host's cross-site
      # check all already expect. Note this is the SAME port npm run test:host
      # requires to be free: they are alternatives, not companions.
      - "5173:5173"
    networks:
      default:
        # Pinned so the host can trust exactly this container as a proxy
        # (LIGATURE_TRUSTED_PROXIES above). Outside the dynamic range, so no
        # other container can be handed it.
        ipv4_address: 172.31.211.200
    environment:
      # Over the Compose network, to the API service. changeOrigin stays false
      # in vite.config.ts, so the browser's Host survives both hops and the
      # host's cross-site check still sees localhost:5173.
      LIGATURE_WEB_API_ORIGIN: "http://host:8080"

      # Listen on every interface, or the published port reaches nothing.
      # Nothing else sets this, and outside a container it is absent.
      LIGATURE_WEB_IN_CONTAINER: "true"
    volumes:
      - ./web/ligature-web:/app

      # Never the developer's node_modules: those are native binaries built for
      # macOS. Docker seeds this volume from the image, where npm ci ran for
      # this platform.
      - node-modules:/app/node_modules

      # The developer's own certificate, READ-ONLY. Nothing in Docker creates,
      # installs or trusts one: mkcert put the authority in the macOS keychain,
      # which is where the browser looks, and the container needs no trust
      # store of its own.
      - ./web/ligature-web/.certs:/app/.certs:ro
    healthcheck:
      # WHAT THIS EXISTS FOR. ./up.sh proves five criteria at STARTUP and says
      # nothing about the minutes after. A dev server that comes back on plain
      # HTTP still reads `Up` here while being unreachable through the published
      # port — that happened, and it cost an afternoon. This makes the state
      # visible as `unhealthy`.
      #
      # It does NOT cure it. Compose's restart policy acts on process EXIT, not
      # on health, so nothing restarts an unhealthy container; the cure is a
      # developer running `restart web`, and AGENTS.md says so.
      #
      # HTTPS on purpose: a server that lost its TLS configuration answers
      # http://localhost:5173 perfectly well, so only a TLS request tells the
      # two apart. rejectUnauthorized is false because TRUST is not what is
      # being tested — the certificate is trusted by the developer's keychain,
      # where the browser looks, and the container needs no trust store.
      #
      # Written in node because node:24-bookworm-slim carries neither curl nor
      # wget. A probe using either would never pass, and would report a working
      # server as broken.
      test:
        - CMD
        - node
        - -e
        - >-
          require('node:https').get({host:'localhost',port:5173,path:'/',rejectUnauthorized:false},
          r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      # Ordering, not readiness, and it stays that way now that the API has a
      # healthcheck. Vite proxies lazily, so the API need only exist by the
      # first request the browser makes; waiting for service_healthy would hold
      # the browser back for a `dotnet watch` build that nothing yet needs.
      host:
        condition: service_started

networks:
  default:
    # A fixed subnet, so the web container's address can be pinned. Other
    # containers are given addresses from the lower half only (ip_range),
    # which keeps the pinned .200 free. Changing this needs the network
    # recreated: `docker compose -f compose.yaml -f compose.dev.yaml down`,
    # then ./up.sh. Volumes, and the database in them, are kept.
    ipam:
      config:
        - subnet: 172.31.211.0/24
          ip_range: 172.31.211.0/25

volumes:
  nuget:
  node-modules:
  host-obj:
  host-bin:
  application-obj:
  application-bin:
  domain-obj:
  domain-bin:
  persistence-obj:
  persistence-bin:
  sharedkernel-obj:
  sharedkernel-bin:
